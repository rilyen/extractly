<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extractly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/extract.js" defer></script>
    
</head>

<body>
    <div class="m-4 mx-4">
            <button id="logoutBtn" onclick="logout()" class="btn btn-primary">Logout</button>
    </div>
    <header>
        <div class="mx-3 my-5 ">
            <h1 class="display-4 fw-bold  text-uppercase text-center">Extractly</h1>
        </div>
    </header>
    <main class="mx-3">
        <div class="mb-3">
            <p class="text-muted">Transcript Extractor for Aether Automations Statements of Work</p>

            <!-- MP4 file input box -->
            <div class="card mb-4">
                <div class="card-body">
                    <label for="videoInputt" class="form-label fw-semibold">Insert MP4 file</label>
                    <input type="file" id="videoInput" accept="video/mp4">
                    <button onclick="extractFromVideo()" class="btn btn-primary">Submit File</button>
                    <span id="status" class="ms-2 text-muted"></span>
                </div>
            </div>

            <!-- Transcript text input box -->
            <div class="card mb-4">
                <div class="card-body">
                    <label for="transcript" class="form-label fw-semibold">Paste Transcript</label>
                    <textarea id="transcript" class="form-control mb-3" rows="6"
                        placeholder="Paste your meeting transcript here..."></textarea>
                    <button onclick="extract()" class="btn btn-primary">Extract JSON</button>
                    <span id="status" class="ms-2 text-muted"></span>
                </div>
            </div>
            
            <div class="card mb-4">
                <div class="card-body">
                    <label class="form-label fw-semibold">Extracted JSON</div> 
                    <pre id="jsonOutput" class="bg-light border rounded p-3 small mb-0 mt-2" style="white-space: pre-wrap;">
                        Extracted JSON will appear here.
                    </pre>
                </div>
            </div>

            <form>
                <h3>Project</h3>
                <hr>
                <!--Sync section-->
                <h3>Sync</h3>
                <hr>
                </hr>
                <h3>Section</h3>
                <hr>
                </hr>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <label from="Integration">Integration</label>
                        <input type="text" id="Integration" name="integration" class="form-control w-25">
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <label for="assignedDesigner" class="col-sm-4 col-form-label">Assigned Designer</label>
                            <div class="col-sm-8">
                                <input type="text" id="Assigned_Designer" name="assignedDesigner" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="dealName" class="col-sm-4 col-form-label">Deal Name</label>
                            <div class="col-sm-8">
                                <input type="text" id="Deal_Name" name="dealName" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <label for="resources" class="col-sm-4 col-form-label">Resources to be used (and
                                links)</label>
                            <div class="col-sm-8">
                                <textarea id="Resources_to_be_used_to_design_and_links" name="resources" class="form-control"
                                    style="field-sizing: content; min-height: 100px;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <div class="row">
                            <label for="projectID" class="col-sm-4 col-form-label">ProjectID</label>
                            <div class="col-sm-8">
                                <input type="text" id="ProjectID" name="projectID" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="companyWebsite" class="col-sm-4 col-form-label">Company website</label>
                            <div class="col-sm-8">
                                <input type="text" id="Company_website" name="companyWebsite" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <label for="designLink" class="col-sm-4 col-form-label">Design Link</label>
                            <div class="col-sm-8">
                                <input type="text" id="Design_Link" name="designLink" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <div class="row">
                            <label for="companyAbout" class="col-sm-4 col-form-label">What is the company about (for
                                context)?</label>
                            <div class="col-sm-8">
                                <textarea id="What_is_the_company_about_for_context" name="companyAbout" class="form-control"
                                    style="field-sizing: content; min-height: 100px;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <div class="row">
                            <label for="productPurpose" class="col-sm-4 col-form-label">What is the purpose of this
                                product?</label>
                            <div class="col-sm-8">
                                <textarea id="What_is_the_purpose_of_this_product" name="productPurpose" class="form-control"
                                    style="field-sizing: content; min-height: 100px;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <div class="row">
                            <label for="projectCostModifier" class="col-sm-4 col-form-label">Project Cost
                                Modifier</label>
                            <div class="col-sm-8">
                                <input type="number" id="Project_Cost_Modifier" name="projectCostModifier"
                                    class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <!--Non Sync section-->
                <h3>Non Sync</h3>
                <hr>
                <h3>Section</h3>
                <hr>
                <div class="row mb-3">
                    <div class=" col-md-6">
                        <label from="stage">Stage</label>
                        <input type="text" id="Stage" name="stage" class="form-control w-25">
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <div class="form-check">
                                <input type="checkbox" id="Review_Project_Docs_and_Requirements" name="reviewProjectDocs">
                                <label for="reviewProjectDocs">Review Project Docs and Requirements</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" id="Draft_Roadmap" name="draftRoadmap">
                                <label for="draftRoadmap">Draft Roadmap</label>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
        <div class=" col-md-6">
            <div class="row">
                <label for="producePurpose" class="col-sm-4 col-form-label">Design Documents to produce (and
                    links)</label>
                <div class="col-sm-8">
                    <textarea id="Resources_to_be_used_to_design_and_links1" name="producePurpose" class="form-control"
                        style="field-sizing: content; min-height: 100px;"></textarea>
                </div>
            </div>
        </div>
        <!--Production section-->
        <h3>Production</h3>
        <hr>
        <h3>Post Production</h3>
        <hr>
        <div class="col-md-6">
            <div class="row">
                <div class="form-check">
                    <input type="checkbox" id="Customer_Feedback_meeting1" name="customerFeedback">
                    <label for="customerFeedback">Customer Feedback (meeting)</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Update_Roadmap" name="updateRoadmap">
                    <label for="updateRoadmap">Update Roadmap</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Create_Update_Userstories1" name="createUpdateUserstories">
                    <label for="createUpdateUserstories">Create/ Update Userstories</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Internal_Review_scope_time_budget" name="internalReview">
                    <label for="internalReview">Internal Review (scope time & budget)</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" id="Submitted_to_Customer_for_Approval" name="submittedForApproval">
                    <label for="submittedForApproval">Submitted to Customer for Approval</label>
                </div>
            </div>
        </div>
        <h3>Time Fields</h3>
        <hr>
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="row">
                    <label for="allocatedBudget" class="col-sm-4 col-form-label">Allocated Budget</label>
                    <div class="col-sm-8">
                        <textarea id="Allocated_Budget" name="allocatedBudget" class="form-control"
                            style="field-sizing: content; min-height: 100px;"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row">
                    <div class="form-check">
                        <input type="checkbox" id="On_track_with_IATs" name="onTrackIATs">
                        <label for="onTrackIATs">On track with IATs?</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="On_track_with_Emails_Videos" name="onTrackEmailsVideos">
                        <label for="onTrackEmailsVideos">On track with Emails & Videos?</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="FLAG_as_Problem" name="flagProblem">
                        <label for="flagProblem">FLAG as Problem!</label>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row my-3">
                    <label for="usedHours" class="col-sm-4 col-form-label">Used Hours</label>
                    <div class="col-sm-8">
                        <textarea id="Used_Hours" name="usedHours" class="form-control"
                            style="field-sizing: content; min-height: 100px;"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="row">
                    <label for="devStartDate" class="col-sm-4 col-form-label ">Dev Start Date</label>
                    <div class="col-sm-8">
                        <input type="text" id="Dev_Start_Date" name="devStartDate" class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="pulledSOWEstimatedTime" class="col-sm-4 col-form-label">PULLED SOW Estimated
                        Time</label>
                    <div class="col-sm-8">
                        <input type="number" id="SOW_Estimated_Time" name="pulledSOWEstimatedTime"
                            class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="devEstimatedTime" class="col-sm-4 col-form-label">Dev Estimated Time</label>
                    <div class="col-sm-8">
                        <input type="number" id="Dev_Estimated_Time" name="devEstimatedTime" class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="projectedCompletionDate" class="col-sm-4 col-form-label">Project Completion Date</label>
                    <div class="col-sm-8">
                        <input type="number" id="Projected_Completion_Date1" name="projectedCompletionDate"
                            class="form-control">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="row my-3">
                    <label for="qcTurnaroundTime" class="col-sm-4 col-form-label">QC Turnaround Time</label>
                    <div class="col-sm-8">
                        <input type="number" id="QC_Turnaround_Time" name="qcTurnaroundTime" class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="projectedDeliveryDate" class="col-sm-4 col-form-label">Project Delivery Date</label>
                    <div class="col-sm-8">
                        <input type="text" id="Projected_Delivery_Date1" name="projectedDeliveryDate" class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="negotiatedDeliveryDueDate" class="col-sm-4 col-form-label">Negotiation Delivery Due
                        Date</label>
                    <div class="col-sm-8">
                        <input type="text" id="Negotiated_Delivery_Due_Date" name="negotiatedDeliveryDueDate"
                            class="form-control">
                    </div>
                </div>
                <div class="row my-3">
                    <label for="projectClass" class="col-sm-4 col-form-label">Project Class</label>
                    <div class="col-sm-8">
                        <input type="text" id="Project_Class" name="projectClass" class="form-control">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="row my-3">
                <label for="productionNotes" class="col-sm-4 col-form-label">Production Notes</label>
                <div class="col-sm-8">
                    <textarea id="Production_Notes" name="productionNotes" class="form-control"
                        style="field-sizing: content; min-height: 100px;"></textarea>
                </div>
            </div>
            <div class="row my-3">
                <label for="customerConcerns" class="col-sm-4 col-form-label">Customer Concerns</label>
                <div class="col-sm-8">
                    <textarea id="Customer_Concerns" name="customerConcerns" class="form-control"
                        style="field-sizing: content; min-height: 100px;"></textarea>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="row">
                <div class="form-check">
                    <input type="checkbox" id="Full_Project_IAT" name="fullProjectIAT">
                    <label for="fullProjectIAT">Full Project IAT</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="QC_Testing" name="qcTestingCompleted">
                    <label for="qcTestingCompleted">QC Testing</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Demo_Video_Recorded" name="demoVideoRecorded">
                    <label for="demoVideoRecorded">Demo Video Recorded</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Edit_Package_Video" name="editPackageVideo">
                    <label for="editPackageVideo">Edit & Package Video</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="Clean_up_database_prep_for_delivery" name="cleanUpDatabase">
                    <label for="cleanUpDatabase">Clean up database & prep for delivery</label>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="row my-3">
                <label for="pullClosingDate" class="col-sm-4 col-form-label">PULL Closing Date</label>
                <div class="col-sm-8">
                    <input type="text" id="Closing_Date" name="pullClosingDate" class="form-control">
                </div>
            </div>
            <div class="row my-3">
                <label for="designDueDate" class="col-sm-4 col-form-label">Design Due Date</label>
                <div class="col-sm-8">
                    <input type="text" id="Design_Due_Date" name="designDueDate" class="form-control">
                </div>
            </div>
            <div class="row my-3">
                <label for="designCompletionDate" class="col-sm-4 col-form-label">Design Completion Date</label>
                <div class="col-sm-8">
                    <input type="text" id="Design_Completion_Date" name="designCompletionDate" class="form-control">
                </div>
            </div>
        </div>
        <hr>
        <div class="m-4 mx-4">
            <!--Waiting on Permission to post to the client's API, the pipeline to post on Zoho's api is built, delete hidden below later. This calls the sendJsonToZoho function in extract.js which calls post controller that calls the service to the zoho api. --> 
            <button onclick="sendJsonToZoho()" type="button" class="btn btn-success">Submit to Zoho</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
        </form>
        </div>
    </main>
</body>

</html>
