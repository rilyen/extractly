<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extractly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/extract.js" defer></script>

</head>

<body>
    <div class="m-4 mx-4">
        <button id="logoutBtn" onclick="logout()" class="btn btn-primary">Logout</button>
    </div>
    <header>
        <div class="mx-3 my-5 ">
            <h1 class="display-4 fw-bold  text-uppercase text-center">Extractly</h1>
        </div>
    </header>
    <main class="mx-3">
        <div class="mb-3">
            <p class="text-muted">Transcript Extractor for Aether Automations Statements of Work</p>

            <!-- MP4 file input box -->
            <div class="card mb-4">
                <div class="card-body">
                    <label for="videoInputt" class="form-label fw-semibold">Insert MP4 file</label>
                    <input type="file" id="videoInput" accept="video/mp4">
                    <button onclick="extractFromVideo()" class="btn btn-primary">Submit File</button>
                    <span id="status" class="ms-2 text-muted"></span>
                </div>
            </div>

            <!-- Transcript text input box -->
            <div class="card mb-4">
                <div class="card-body">
                    <label for="transcript" class="form-label fw-semibold">Paste Transcript</label>
                    <textarea id="transcript" class="form-control mb-3" rows="6"
                        placeholder="Paste your meeting transcript here..."></textarea>
                    <button onclick="extract()" class="btn btn-primary">Extract JSON</button>
                    <span id="status" class="ms-2 text-muted"></span>
                </div>
            </div>
            <form id="productDetailsForm">

                <!-- SECTION 1: Product Details -->
                <h3 class="mb-3">Product Details</h3>
                <hr>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Project" class="col-sm-4 col-form-label">Project</label>
                            <div class="col-sm-8">
                                <select id="Project" name="Project" class="form-select">
                                    <option value="">-Select-</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Deal_ID" class="col-sm-4 col-form-label">Deal ID</label>
                            <div class="col-sm-8">
                                <input type="number" id="Deal_ID" name="Deal_ID" class="form-control"
                                    placeholder="#######">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Deal_Name" class="col-sm-4 col-form-label">Deal Name - Account - Contact</label>
                            <div class="col-sm-8">
                                <select id="Deal_Name" name="Deal_Name" class="form-select">
                                    <option value="">-Select-</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Product_Name" class="col-sm-4 col-form-label">What is the
                                name of this Product? <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <input type="text" id="Product_Name" name="Product_Name" class="form-control" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="row">
                            <label for="Product_Description" class="col-sm-2 col-form-label">Product Description <span
                                    class="text-danger">*</span></label>
                            <div class="col-sm-10">
                                <textarea id="Product_Description" name="Product_Description" class="form-control"
                                    style="field-sizing: content; min-height: 150px;"
                                    required>Aether will create within the Client's Zoho CRM Application Workflows and custom functions that:</textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Delivery_Rate" class="col-sm-4 col-form-label">Delivery Rate <span
                                    class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <select id="Delivery_Rate" name="Delivery_Rate" class="form-select" required>
                                    <option value="Normal">Normal</option>
                                    <option value="Urgent">Urgent</option>
                                    <option value="Immediate">Immediate</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <div id="Instructions1" class="form-text">This form is the add a new product to a Deal.</div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Service_Types" class="col-sm-4 col-form-label">What types of services are
                                required for this product? <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <select id="Service_Types" name="Service_Types" class="form-select" required>
                                    <option value="">-Select-</option>
                                    <option value="Custom Functions">Custom Functions</option>
                                    <option value="Non-Zoho App Integration">Non-Zoho App Integration</option>
                                    <option value="Building a Form/Module">Building a Form/Module</option>
                                    <option value="Creating a Merge template">Creating a Merge template</option>
                                    <option value="Other">Other</option>
                                </select>
                                <small class="form-text text-muted">Select all that apply</small>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 2: Statement of Work Generator -->
                    <h3 class="mb-3 mt-5">Statement of Work Generator</h3>
                    <hr>


                    <div class="col-md-6">
                        <div class="row">
                            <label for="Total_Product_Cost_Hours" class="col-sm-4 col-form-label">Total Product Cost
                                (Hours)</label>
                            <div class="col-sm-8">
                                <input type="number" id="Total_Product_Cost_Hours" name="Total_Product_Cost_Hours"
                                    class="form-control" step="0.1" placeholder="#######.##">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-sm-8 offset-sm-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="Calculate_Hours"
                                        name="Calculate_Hours">
                                    <label class="form-check-label" for="Calculate_Hours">Calculate Hours</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="Generate_Product_Description"
                                        name="Generate_Product_Description">
                                    <label class="form-check-label" for="Generate_Product_Description">Generate Product
                                        Description</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="Freeze_Product_Description"
                                        name="Freeze_Product_Description">
                                    <label class="form-check-label" for="Freeze_Product_Description">Freeze Product
                                        Description</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="row">
                            <label for="Product_Description" class="col-sm-2 col-form-label">Product Description</label>
                            <div class="col-sm-10">
                                <textarea id="Product_Description" name="Product_Description" class="form-control"
                                    style="field-sizing: content; min-height: 150px;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="row">
                            <label for="Estimated_Duration_to_Implement_Days" class="col-sm-4 col-form-label">Estimated
                                Duration  to Implement (days)</label>
                            <div class="col-sm-8">
                                <input type="number" id="Estimated_Duration_to_Implement_Days"
                                    name="Estimated_Duration_to_Implement_Days" class="form-control" placeholder="0">
                            </div>
                        </div>
                    </div>
                   
                    <!-- SECTION 3: Product Review Section -->
                      <h3 class="mb-3 mt-5">Statement of Work Generator</h3>
                    <hr>
                    <div class="row mb-3 mt-4">
                        <div class="col-md-6">
                            <div class="row">
                                <label for="Reviewer_Approver" class="col-sm-4 col-form-label">Reviewer /
                                    Approver</label>
                                <div class="col-sm-8">
                                    <select id="Reviewer_Approver" name="Reviewer_Approver" class="form-select">
                                        <option value="">-Select-</option>
                                        <option value="Choice 1">Choice 1</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <label for="Latest_Review_Date" class="col-sm-4 col-form-label">Latest Review
                                    Date</label>
                                <div class="col-sm-8">
                                    <input type="date" id="Latest_Review_Date" name="Latest_Review_Date"
                                        class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="row">
                                <label for="General_Comments" class="col-sm-4 col-form-label">General Comments</label>
                                <div class="col-sm-8">
                                    <textarea id="General_Comments" name="General_Comments" class="form-control"
                                        style="field-sizing: content; min-height: 100px;"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <div class="col-sm-8 offset-sm-4">
                                    <div class="form-check mt-2">
                                        <input class="form-check-input" type="checkbox" id="Passed_IAT"
                                            name="Passed_IAT">
                                        <label class="form-check-label" for="Passed_IAT">Passed IAT</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="row">
                                <label for="Task_ID" class="col-sm-4 col-form-label">Task ID</label>
                                <div class="col-sm-8">
                                    <input type="text" id="Task_ID" name="Task_ID" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-sm-8 offset-sm-4">
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="User_Story_Created"
                                        name="User_Story_Created">
                                    <label class="form-check-label" for="User_Story_Created">User Story Created</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>

                <div class="row mt-3">
                    <div class="col-md-12">
                        <button type="submit" class="btn btn-success me-2">Submit</button>
                        <button type="reset" class="btn btn-outline-secondary">Reset</button>
                    </div>
                </div>

            </form>
        </div>
    </main>
</body>

</html>
