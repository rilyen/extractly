<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extractly - Register</title>
</head>
<body>
    <h1>Register</h1>
    <form id="registerForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password (min 8 characters)" required>
        <button type="submit">Register</button>
    </form>
    <p id="status"></p>
    <a href="/login.html">Already have an account? Login</a>

    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusEl = document.getElementById('status');

        statusEl.textContent = 'Registering...';

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {

                statusEl.textContent = data.error || Object.values(data).join(' ');
                return;
            }

            statusEl.textContent = 'Registered! Redirecting to login...';
            setTimeout(() => window.location.href = '/login.html', 1000);

        } catch (err) {
            statusEl.textContent = 'Something went wrong.';
            console.error(err);
        }
    });
    </script>
</body>
</html>
